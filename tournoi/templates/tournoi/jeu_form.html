{% extends 'tournoi/base.html' %}

{% block title %}Ajouter un jeu{% endblock %}

{% block content %}
<section class="panel form-panel">
    <h1>Ajouter un jeu au catalogue</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {% include 'tournoi/_form_fields.html' %}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Ajouter le jeu</button>
            <a class="btn" href="{% url 'tournoi:accueil' %}">Annuler</a>
        </div>
    </form>
</section>
{% endblock %}
